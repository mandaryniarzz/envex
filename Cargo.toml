[package]
name = "envex"
version = "0.2.0"
edition = "2024"
description = "CLI tool to generate, sync and validate .env.example files"
license = "Apache-2.0"

[[bin]]
name = "envex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
getrandom = "0.2"

[profile.release]
lto = true
strip = true
opt-level = 3
